name: Production Release Infrastructure

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: gic-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: gic-aarch64-linux

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross Compilation Utilities
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create Package Archive (tar.gz)
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/gic staging/gic
          cp README.md LICENSE staging/
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C staging .

      - name: Build Debian Package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p gic_${VERSION}_amd64/DEBIAN
          mkdir -p gic_${VERSION}_amd64/usr/bin
          
          # Update version in control file
          sed -i "s/Version: .*/Version: $VERSION/" packaging/debian/control
          
          cp packaging/debian/control gic_${VERSION}_amd64/DEBIAN/
          cp target/${{ matrix.target }}/release/gic gic_${VERSION}_amd64/usr/bin/
          dpkg-deb --build gic_${VERSION}_amd64
          mv gic_${VERSION}_amd64.deb ${{ matrix.asset_name }}.deb

      - name: Build RPM Package
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Update version in spec file
          sed -i "s/Version:\s*.*/Version:        $VERSION/" packaging/rpm/gic.spec
          
          cp packaging/rpm/gic.spec ~/rpmbuild/SPECS/
          # Create source tarball
          tar -czvf ~/rpmbuild/SOURCES/gic-${VERSION}.tar.gz --transform "s,^\.,gic-${VERSION}," --exclude=.git .
          rpmbuild -ba ~/rpmbuild/SPECS/gic.spec
          cp ~/rpmbuild/RPMS/x86_64/gic-${VERSION}-1.*.rpm ${{ matrix.asset_name }}.rpm

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset_name }}-packages
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.deb
            ${{ matrix.asset_name }}.rpm
          if-no-files-found: ignore

  create-github-release:
    name: Create GitHub Release & Upload Packages
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Generate Checksums & Organize Artifacts
        run: |
          mkdir -p release_assets
          cp artifacts/*/*.tar.gz release_assets/ 2>/dev/null || true
          cp artifacts/*/*.deb release_assets/ 2>/dev/null || true
          cp artifacts/*/*.rpm release_assets/ 2>/dev/null || true
          cd release_assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_assets/*.tar.gz
            release_assets/*.deb
            release_assets/*.rpm
            release_assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
