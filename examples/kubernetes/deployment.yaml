apiVersion: apps/v1
kind: Deployment
metadata:
  name: gic-demo-app
  namespace: default
  labels:
    app: gic-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gic-demo
  template:
    metadata:
      labels:
        app: gic-demo
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
